<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>GeoCapitales</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:rgba(255,255,255,.97);--text:#0f172a;--muted:#475569;--blue:#1746c7;--green:#15803d;--red:#b91c1c;--border:#9aa8b8;--shadow:0 10px 30px rgba(15,23,42,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:#cbd5e1}
button,input{font:inherit} button{cursor:pointer;touch-action:manipulation}
#map{position:fixed;inset:0;width:100%;height:100dvh;background:#cbd5e1}
.panel{position:fixed;left:10px;right:10px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.top{top:calc(10px + env(safe-area-inset-top));padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bottom{bottom:calc(10px + env(safe-area-inset-bottom));padding:12px}
.label{display:block;color:var(--muted);font-size:.69rem;font-weight:800;text-transform:uppercase}
#capital{display:block;font-size:clamp(1.08rem,5vw,1.5rem);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#country{font-size:.8rem;color:var(--muted);font-weight:650}
.scores{display:flex;gap:10px;text-align:center} .scores div{min-width:44px} .scores strong{display:block}
#message{min-height:42px;margin-bottom:9px;font-size:.91rem;line-height:1.35}
.actions{display:grid;grid-template-columns:1fr auto;gap:9px}
.btn{min-height:48px;border:0;border-radius:13px;padding:11px 14px;font-weight:850}
.primary{background:var(--blue);color:white} .secondary{background:#dbe7ff;color:#173578} .danger{background:#fee2e2;color:#991b1b}
#homeBtn{width:50px;padding:0}
.overlay{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.7);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{width:min(100%,460px);max-height:90dvh;overflow:auto;background:white;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.modal h1,.modal h2{margin:0 0 8px} .modal p{margin:0 0 14px;color:var(--muted);line-height:1.42}
.modal input{width:100%;min-height:50px;margin-bottom:10px;border:1px solid var(--border);border-radius:13px;padding:11px 13px}
.stack{display:grid;gap:9px} .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.tabs button{min-height:43px;border:0;border-radius:11px;font-weight:800} .tabs .active{background:var(--blue);color:white}
.code{display:block;font-size:2rem;font-weight:950;letter-spacing:.12em;text-align:center;margin:10px 0}
.status{padding:13px;border:1px solid var(--border);border-radius:13px;background:#f8fafc;line-height:1.45}
.account{position:fixed;top:calc(96px + env(safe-area-inset-top));right:10px;z-index:1002;min-height:42px;max-width:60vw;border:1px solid var(--border);border-radius:13px;padding:9px 12px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaflet-control-zoom{margin-top:calc(94px + env(safe-area-inset-top))!important}
.leaflet-control-attribution{font-size:8px!important;max-width:70vw}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel top">
  <div><span class="label">Capitale à placer</span><strong id="capital">Connexion requise</strong><span id="country"></span></div>
  <div class="scores">
    <div><span class="label">Moi</span><strong id="meScore">0</strong></div>
    <div><span class="label">Advers.</span><strong id="oppScore">0</strong></div>
    <div><span class="label">Manche</span><strong id="round">–</strong></div>
  </div>
</div>

<button id="accountBtn" class="account">Se connecter</button>

<div class="panel bottom">
  <div id="message">Connectez-vous pour commencer.</div>
  <div class="actions">
    <button id="continueBtn" class="btn primary" disabled>Continuer</button>
    <button id="homeBtn" class="btn secondary">⌂</button>
  </div>
</div>

<div id="authModal" class="overlay open"><div class="modal">
  <h1>GeoCapitales</h1>
  <p>Créez un compte ou connectez-vous pour affronter un autre joueur.</p>
  <div class="tabs"><button id="loginTab" class="active">Connexion</button><button id="signupTab">Inscription</button></div>
  <input id="username" placeholder="Pseudo" maxlength="20" style="display:none">
  <input id="email" type="email" placeholder="Adresse e-mail">
  <input id="password" type="password" placeholder="Mot de passe (6 caractères minimum)">
  <div id="authError" style="min-height:25px;color:#b91c1c"></div>
  <button id="authSubmit" class="btn primary" style="width:100%">Se connecter</button>
</div></div>

<div id="lobbyModal" class="overlay"><div class="modal">
  <h2>Combats</h2>
  <p id="welcome"></p>
  <div class="stack">
    <button id="createBtn" class="btn primary">Créer un combat</button>
    <input id="joinCode" maxlength="6" placeholder="CODE DU COMBAT" style="text-transform:uppercase;text-align:center;font-weight:900;letter-spacing:.12em">
    <button id="joinBtn" class="btn secondary">Rejoindre ce combat</button>
    <button id="logoutBtn" class="btn danger">Se déconnecter</button>
  </div>
  <div id="lobbyError" style="min-height:25px;margin-top:10px;color:#b91c1c"></div>
</div></div>

<div id="waitModal" class="overlay"><div class="modal">
  <h2>Combat créé</h2><p>Envoyez ce code à votre adversaire :</p>
  <strong id="codeDisplay" class="code">------</strong>
  <div id="waitText" class="status">En attente du deuxième joueur…</div>
  <div class="stack" style="margin-top:10px">
    <button id="copyBtn" class="btn secondary">Copier le code</button>
    <button id="backBtn" class="btn danger">Retour au menu</button>
  </div>
</div></div>

<div id="resultModal" class="overlay"><div class="modal">
  <h2>Résultat de la manche</h2>
  <div id="resultText" class="status"></div>
  <button id="nextRoundBtn" class="btn primary" style="width:100%;margin-top:10px">Manche suivante</button>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient('https://siuifmyzqesgvgggrruje.supabase.co','sb_publishable_pgVeJnUTNU2HGxZ6aSs3RQ_dZwffSGX');
const map=L.map("map",{worldCopyJump:true,minZoom:2,maxZoom:7}).setView([20,8],2);

fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
.then(r=>r.json()).then(data=>L.geoJSON(data,{interactive:false,style:{color:"#0f172a",weight:1.45,fillColor:"#f8fafc",fillOpacity:1}}).addTo(map))
.catch(()=>msg("Impossible de charger les frontières.","error"));

const $=id=>document.getElementById(id);
const ui={auth:$("authModal"),lobby:$("lobbyModal"),wait:$("waitModal"),result:$("resultModal")};
let mode="login",user=null,profile=null,matchId=null,state=null,timer=null,canAnswer=false,submittedRound=null;
let guessMarker=null,answerMarker=null,line=null;

function open(x){x.classList.add("open")} function close(x){x.classList.remove("open")}
function msg(t,type=""){$("message").className=type;$("message").innerHTML=t}
function clearMap(){[guessMarker,answerMarker,line].forEach(x=>x&&map.removeLayer(x));guessMarker=answerMarker=line=null}
function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("signupTab").classList.toggle("active",m==="signup");$("username").style.display=m==="signup"?"block":"none";$("authSubmit").textContent=m==="signup"?"Créer mon compte":"Se connecter";$("authError").textContent=""}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");

async function auth(){
 const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();
 $("authError").textContent="";
 if(!email||password.length<6){$("authError").textContent="E-mail et mot de passe de 6 caractères minimum requis.";return}
 try{
   if(mode==="signup"){
     if(username.length<2)throw new Error("Pseudo trop court.");
     const {data,error}=await db.auth.signUp({email,password,options:{data:{username}}});
     if(error)throw error;
     if(!data.session){$("authError").style.color="#15803d";$("authError").textContent="Compte créé. Vérifiez votre e-mail si une confirmation est demandée.";return}
   }else{
     const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
   }
   await loadUser();
 }catch(e){$("authError").style.color="#b91c1c";$("authError").textContent=e.message}
}
$("authSubmit").onclick=auth;

async function loadUser(){
 const {data:{user:u}}=await db.auth.getUser();user=u;
 if(!u){open(ui.auth);return}
 const {data,error}=await db.from("profiles").select("username,games_played,wins,losses,best_score").eq("id",u.id).single();
 if(error)throw error;profile=data;
 $("accountBtn").textContent="👤 "+profile.username;
 $("welcome").textContent=`Connecté en tant que ${profile.username} — ${profile.wins} victoire(s), ${profile.losses} défaite(s).`;
 close(ui.auth);open(ui.lobby);resetDisplay();
}

function resetDisplay(){
 stopPoll();matchId=null;state=null;submittedRound=null;canAnswer=false;clearMap();
 $("capital").textContent="Choisissez un combat";$("country").textContent="";$("meScore").textContent="0";$("oppScore").textContent="0";$("round").textContent="–";
 msg("Créez un combat ou rejoignez celui d’un autre joueur.");map.setView([20,8],2);
}

async function createMatch(){
 $("lobbyError").textContent="";
 try{
  const {data,error}=await db.rpc("create_match");if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;matchId=row.match_id;$("codeDisplay").textContent=row.join_code;
  close(ui.lobby);open(ui.wait);startPoll();
 }catch(e){$("lobbyError").textContent=e.message}
}
$("createBtn").onclick=createMatch;

async function joinMatch(){
 const code=$("joinCode").value.trim().toUpperCase();$("lobbyError").textContent="";
 if(code.length!==6){$("lobbyError").textContent="Le code doit contenir 6 caractères.";return}
 try{
  const {data,error}=await db.rpc("join_match",{p_join_code:code});if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;matchId=row.match_id;close(ui.lobby);startPoll();await refresh();
 }catch(e){$("lobbyError").textContent=e.message}
}
$("joinBtn").onclick=joinMatch;

function startPoll(){stopPoll();refresh();timer=setInterval(refresh,1800)} function stopPoll(){if(timer)clearInterval(timer);timer=null}

async function refresh(){
 if(!matchId)return;
 const {data,error}=await db.rpc("get_match_state",{p_match_id:matchId});
 if(error){msg(error.message,"error");return}
 const s=Array.isArray(data)?data[0]:data;if(!s)return;
 const prev=state?.current_round;state=s;

 if(s.status==="waiting"){$("waitText").textContent="En attente du deuxième joueur…";return}
 close(ui.wait);updateScore(s);

 if(s.status==="finished"){canAnswer=false;$("capital").textContent="Combat terminé";$("country").textContent="";msg(finalText(s),"success");stopPoll();return}

 if(submittedRound!==null&&s.current_round>submittedRound){await showResult(submittedRound);submittedRound=null;return}
 if(prev!==s.current_round||!s.has_answered)prepareRound(s);
 if(s.has_answered){canAnswer=false;msg("Réponse enregistrée. En attente de l’adversaire…")}
}

function amHost(s){return s.host_username===profile.username}
function updateScore(s){$("meScore").textContent=(amHost(s)?s.host_score:s.guest_score).toLocaleString("fr-FR");$("oppScore").textContent=(amHost(s)?s.guest_score:s.host_score).toLocaleString("fr-FR");$("round").textContent=s.current_round+"/"+s.round_count}
function prepareRound(s){clearMap();map.setView([20,8],2);$("capital").textContent=s.capital||"En attente…";$("country").textContent=s.country?"Capitale de "+s.country:"";canAnswer=!s.has_answered&&s.status==="active";msg(canAnswer?"Touchez la carte pour placer cette capitale.":"En attente de l’adversaire…")}

map.on("click",async e=>{
 if(!canAnswer||!matchId||!state)return;canAnswer=false;
 guessMarker=L.circleMarker(e.latlng,{radius:9,weight:3,color:"#b91c1c",fillColor:"#ef4444",fillOpacity:.95}).addTo(map);
 const r=state.current_round;msg("Envoi de votre réponse…");
 const {data,error}=await db.rpc("submit_answer",{p_match_id:matchId,p_latitude:e.latlng.lat,p_longitude:e.latlng.lng});
 if(error){msg(error.message,"error");canAnswer=true;return}
 const x=Array.isArray(data)?data[0]:data;submittedRound=r;
 msg(`<strong>${Math.round(x.distance_km).toLocaleString("fr-FR")} km</strong> — ${x.score.toLocaleString("fr-FR")} points. En attente…`);
 if(x.round_complete){await showResult(r);submittedRound=null}
});

async function showResult(r){
 const {data,error}=await db.rpc("get_round_result",{p_match_id:matchId,p_round_number:r});if(error)return;
 const x=Array.isArray(data)?data[0]:data,h=amHost(state);
 const myScore=h?x.host_score:x.guest_score,oppScore=h?x.guest_score:x.host_score;
 const myDist=h?x.host_distance:x.guest_distance,oppDist=h?x.guest_distance:x.host_distance;
 answerMarker=L.circleMarker([x.correct_latitude,x.correct_longitude],{radius:9,weight:3,color:"#15803d",fillColor:"#22c55e",fillOpacity:.95}).addTo(map);
 if(guessMarker){line=L.polyline([guessMarker.getLatLng(),answerMarker.getLatLng()],{weight:3,color:"#334155",dashArray:"7,8"}).addTo(map);map.fitBounds(L.latLngBounds([guessMarker.getLatLng(),answerMarker.getLatLng()]),{padding:[60,60],maxZoom:6})}
 $("resultText").innerHTML=`<strong>${x.capital} — ${x.country}</strong><br><br>Vous : ${Math.round(myDist)} km, ${myScore} points.<br>Adversaire : ${Math.round(oppDist)} km, ${oppScore} points.`;
 open(ui.result);
}

function finalText(s){const mine=amHost(s)?s.host_score:s.guest_score,theirs=amHost(s)?s.guest_score:s.host_score;return mine>theirs?`<strong>Victoire !</strong> ${mine} à ${theirs}.`:mine<theirs?`<strong>Défaite.</strong> ${mine} à ${theirs}.`:`<strong>Égalité.</strong> ${mine} à ${theirs}.`}

$("nextRoundBtn").onclick=async()=>{close(ui.result);clearMap();await refresh()};
$("copyBtn").onclick=async()=>{await navigator.clipboard.writeText($("codeDisplay").textContent);$("waitText").textContent="Code copié."};
$("backBtn").onclick=()=>{close(ui.wait);open(ui.lobby);resetDisplay()};
$("homeBtn").onclick=()=>{resetDisplay();open(ui.lobby)};
$("accountBtn").onclick=()=>user?open(ui.lobby):open(ui.auth);
$("logoutBtn").onclick=async()=>{await db.auth.signOut();user=profile=null;close(ui.lobby);resetDisplay();open(ui.auth)};

(async()=>{try{const {data:{session}}=await db.auth.getSession();if(session)await loadUser()}catch(e){$("authError").textContent=e.message}})();
window.addEventListener("resize",()=>map.invalidateSize());
</script>
</body>
</html>
