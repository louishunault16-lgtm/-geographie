<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GeoCapitales</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --panel: rgba(255,255,255,.96);
      --text: #172033;
      --muted: #64748b;
      --accent: #2563eb;
      --success: #15803d;
      --danger: #b91c1c;
      --border: #dbe2ea;
      --shadow: 0 10px 28px rgba(15,23,42,.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #dbeafe;
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 1;
    }

    .top-panel {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(219,226,234,.95);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .small-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    #capitalName {
      display: block;
      overflow: hidden;
      font-size: clamp(1.1rem, 5vw, 1.55rem);
      font-weight: 850;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #countryHint {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
    }

    .score-box {
      display: flex;
      gap: 11px;
      text-align: center;
    }

    .score-box div {
      min-width: 45px;
    }

    .score-box strong {
      display: block;
      font-size: .98rem;
    }

    .account-button {
      position: fixed;
      top: calc(96px + env(safe-area-inset-top));
      right: 10px;
      z-index: 1001;
      min-height: 42px;
      max-width: 55vw;
      overflow: hidden;
      border: 0;
      border-radius: 13px;
      padding: 9px 12px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bottom-panel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
      padding: 12px;
      border: 1px solid rgba(219,226,234,.95);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    #message {
      min-height: 43px;
      margin-bottom: 9px;
      font-size: .91rem;
      line-height: 1.35;
    }

    #message.success { color: var(--success); }
    #message.error { color: var(--danger); }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .actions button,
    .modal button {
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      font-weight: 800;
      cursor: pointer;
    }

    #nextButton,
    .primary {
      background: var(--accent);
      color: white;
    }

    #restartButton {
      width: 48px;
      padding: 0;
      background: #e8eefc;
      color: #1e3a8a;
      font-size: 1.25rem;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15,23,42,.55);
      backdrop-filter: blur(5px);
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      width: min(100%, 440px);
      max-height: 86dvh;
      overflow: auto;
      padding: 20px;
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .modal h1,
    .modal h2 {
      margin: 0 0 8px;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .modal input {
      width: 100%;
      min-height: 50px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
      color: var(--text);
      background: white;
    }

    .modal-actions {
      display: grid;
      gap: 9px;
    }

    .secondary {
      background: #e8eefc;
      color: #1e3a8a;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .profile-card {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 12px;
      text-align: center;
    }

    .profile-stats div {
      padding: 9px 5px;
      border-radius: 10px;
      background: #f1f5f9;
    }

    .profile-stats strong {
      display: block;
    }

    .leaflet-control-zoom {
      margin-top: calc(94px + env(safe-area-inset-top)) !important;
    }

    .leaflet-control-attribution {
      max-width: 70vw;
      font-size: 8px !important;
    }

    @media (min-width: 760px) {
      .top-panel,
      .bottom-panel {
        right: auto;
        width: 440px;
      }

      .account-button {
        right: auto;
        left: 460px;
        max-width: 240px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <header class="top-panel">
    <div>
      <span class="small-label">Capitale à placer</span>
      <strong id="capitalName">Chargement…</strong>
      <span id="countryHint"></span>
    </div>

    <div class="score-box">
      <div>
        <span class="small-label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span class="small-label">Manche</span>
        <strong><span id="round">1</span>/10</strong>
      </div>
    </div>
  </header>

  <button id="accountButton" class="account-button">Compte</button>

  <section class="bottom-panel">
    <div id="message">Touchez la carte pour placer la capitale.</div>
    <div class="actions">
      <button id="nextButton" disabled>Capitale suivante</button>
      <button id="restartButton" aria-label="Recommencer">↻</button>
    </div>
  </section>

  <div id="loginOverlay" class="overlay open">
    <section class="modal">
      <h1>GeoCapitales</h1>
      <p>Créez un profil local ou connectez-vous avec un pseudo déjà utilisé sur ce téléphone.</p>

      <input id="usernameInput"
             type="text"
             maxlength="20"
             autocomplete="username"
             placeholder="Votre pseudo">

      <div class="modal-actions">
        <button id="loginButton" class="primary">Entrer dans le jeu</button>
      </div>
    </section>
  </div>

  <div id="accountOverlay" class="overlay">
    <section class="modal">
      <h2>Mon compte</h2>
      <div id="profileContent"></div>

      <div class="modal-actions">
        <button id="closeAccountButton" class="secondary">Retour au jeu</button>
        <button id="changeAccountButton" class="secondary">Changer de compte</button>
        <button id="deleteAccountButton" class="danger">Supprimer ce compte local</button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const capitals = [
      { capital: "Paris", country: "France", lat: 48.8566, lng: 2.3522 },
      { capital: "Madrid", country: "Espagne", lat: 40.4168, lng: -3.7038 },
      { capital: "Rome", country: "Italie", lat: 41.9028, lng: 12.4964 },
      { capital: "Lisbonne", country: "Portugal", lat: 38.7223, lng: -9.1393 },
      { capital: "Berlin", country: "Allemagne", lat: 52.5200, lng: 13.4050 },
      { capital: "Londres", country: "Royaume-Uni", lat: 51.5074, lng: -0.1278 },
      { capital: "Oslo", country: "Norvège", lat: 59.9139, lng: 10.7522 },
      { capital: "Stockholm", country: "Suède", lat: 59.3293, lng: 18.0686 },
      { capital: "Varsovie", country: "Pologne", lat: 52.2297, lng: 21.0122 },
      { capital: "Athènes", country: "Grèce", lat: 37.9838, lng: 23.7275 },
      { capital: "Rabat", country: "Maroc", lat: 34.0209, lng: -6.8416 },
      { capital: "Alger", country: "Algérie", lat: 36.7538, lng: 3.0588 },
      { capital: "Le Caire", country: "Égypte", lat: 30.0444, lng: 31.2357 },
      { capital: "Pretoria", country: "Afrique du Sud", lat: -25.7479, lng: 28.2293 },
      { capital: "Abuja", country: "Nigeria", lat: 9.0765, lng: 7.3986 },
      { capital: "Nairobi", country: "Kenya", lat: -1.2921, lng: 36.8219 },
      { capital: "Antananarivo", country: "Madagascar", lat: -18.8792, lng: 47.5079 },
      { capital: "Ottawa", country: "Canada", lat: 45.4215, lng: -75.6972 },
      { capital: "Washington", country: "États-Unis", lat: 38.9072, lng: -77.0369 },
      { capital: "Mexico", country: "Mexique", lat: 19.4326, lng: -99.1332 },
      { capital: "Brasília", country: "Brésil", lat: -15.7939, lng: -47.8828 },
      { capital: "Buenos Aires", country: "Argentine", lat: -34.6037, lng: -58.3816 },
      { capital: "Santiago", country: "Chili", lat: -33.4489, lng: -70.6693 },
      { capital: "Lima", country: "Pérou", lat: -12.0464, lng: -77.0428 },
      { capital: "Bogota", country: "Colombie", lat: 4.7110, lng: -74.0721 },
      { capital: "Moscou", country: "Russie", lat: 55.7558, lng: 37.6173 },
      { capital: "Pékin", country: "Chine", lat: 39.9042, lng: 116.4074 },
      { capital: "New Delhi", country: "Inde", lat: 28.6139, lng: 77.2090 },
      { capital: "Tokyo", country: "Japon", lat: 35.6762, lng: 139.6503 },
      { capital: "Séoul", country: "Corée du Sud", lat: 37.5665, lng: 126.9780 },
      { capital: "Jakarta", country: "Indonésie", lat: -6.2088, lng: 106.8456 },
      { capital: "Canberra", country: "Australie", lat: -35.2809, lng: 149.1300 },
      { capital: "Wellington", country: "Nouvelle-Zélande", lat: -41.2866, lng: 174.7756 },
      { capital: "Riyad", country: "Arabie saoudite", lat: 24.7136, lng: 46.6753 },
      { capital: "Ankara", country: "Turquie", lat: 39.9334, lng: 32.8597 },
      { capital: "Bruxelles", country: "Belgique", lat: 50.8503, lng: 4.3517 },
      { capital: "Amsterdam", country: "Pays-Bas", lat: 52.3676, lng: 4.9041 },
      { capital: "Berne", country: "Suisse", lat: 46.9480, lng: 7.4474 },
      { capital: "Vienne", country: "Autriche", lat: 48.2082, lng: 16.3738 },
      { capital: "Dublin", country: "Irlande", lat: 53.3498, lng: -6.2603 }
    ];

    const map = L.map("map", {
      worldCopyJump: true,
      minZoom: 2,
      maxZoom: 7,
      zoomControl: true
    }).setView([20, 8], 2);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(map);

    const capitalNameEl = document.getElementById("capitalName");
    const countryHintEl = document.getElementById("countryHint");
    const scoreEl = document.getElementById("score");
    const roundEl = document.getElementById("round");
    const messageEl = document.getElementById("message");
    const nextButton = document.getElementById("nextButton");
    const restartButton = document.getElementById("restartButton");
    const accountButton = document.getElementById("accountButton");
    const loginOverlay = document.getElementById("loginOverlay");
    const accountOverlay = document.getElementById("accountOverlay");
    const usernameInput = document.getElementById("usernameInput");
    const loginButton = document.getElementById("loginButton");
    const profileContent = document.getElementById("profileContent");

    let currentUser = null;
    let gameCapitals = [];
    let currentCapital = null;
    let currentRound = 1;
    let totalScore = 0;
    let hasAnswered = false;
    let guessMarker = null;
    let answerMarker = null;
    let answerLine = null;

    function normalizeUsername(value) {
      return value.trim().replace(/\s+/g, " ");
    }

    function storageKey(username) {
      return "geocapitales_profile_" + username.toLowerCase();
    }

    function getProfile(username) {
      const raw = localStorage.getItem(storageKey(username));
      if (raw) return JSON.parse(raw);

      return {
        username,
        games: 0,
        bestScore: 0,
        totalScore: 0
      };
    }

    function saveProfile(profile) {
      localStorage.setItem(storageKey(profile.username), JSON.stringify(profile));
      localStorage.setItem("geocapitales_current_user", profile.username);
    }

    function login() {
      const username = normalizeUsername(usernameInput.value);

      if (username.length < 2) {
        usernameInput.focus();
        usernameInput.placeholder = "Pseudo de 2 caractères minimum";
        return;
      }

      currentUser = getProfile(username);
      currentUser.username = username;
      saveProfile(currentUser);

      accountButton.textContent = "👤 " + username;
      loginOverlay.classList.remove("open");
      startGame();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("geocapitales_current_user");
      accountOverlay.classList.remove("open");
      usernameInput.value = "";
      loginOverlay.classList.add("open");
    }

    function deleteCurrentAccount() {
      if (!currentUser) return;
      localStorage.removeItem(storageKey(currentUser.username));
      logout();
    }

    function showAccount() {
      if (!currentUser) return;

      const average = currentUser.games
        ? Math.round(currentUser.totalScore / currentUser.games)
        : 0;

      profileContent.innerHTML = `
        <div class="profile-card">
          <strong>${escapeHtml(currentUser.username)}</strong>
          <div class="profile-stats">
            <div><span class="small-label">Parties</span><strong>${currentUser.games}</strong></div>
            <div><span class="small-label">Record</span><strong>${currentUser.bestScore}</strong></div>
            <div><span class="small-label">Moyenne</span><strong>${average}</strong></div>
          </div>
        </div>
      `;

      accountOverlay.classList.add("open");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function clearMapResults() {
      [guessMarker, answerMarker, answerLine].forEach(layer => {
        if (layer) map.removeLayer(layer);
      });

      guessMarker = null;
      answerMarker = null;
      answerLine = null;
    }

    function startGame() {
      gameCapitals = shuffle(capitals).slice(0, 10);
      currentRound = 1;
      totalScore = 0;
      scoreEl.textContent = "0";
      map.setView([20, 8], 2, { animate: false });
      loadRound();
      setTimeout(() => map.invalidateSize(), 120);
    }

    function loadRound() {
      clearMapResults();
      hasAnswered = false;
      currentCapital = gameCapitals[currentRound - 1];

      capitalNameEl.textContent = currentCapital.capital;
      countryHintEl.textContent = "Capitale de " + currentCapital.country;
      roundEl.textContent = currentRound;
      messageEl.className = "";
      messageEl.textContent = "Touchez la carte pour placer la capitale.";
      nextButton.disabled = true;
      nextButton.textContent = currentRound === 10
        ? "Voir le résultat"
        : "Capitale suivante";
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const radius = 6371;
      const toRad = value => value * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

      return radius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateScore(distance) {
      return Math.max(0, Math.round(1000 * Math.exp(-distance / 1000)));
    }

    function getQuality(distance) {
      if (distance < 50) return "Exceptionnel !";
      if (distance < 150) return "Excellent !";
      if (distance < 400) return "Très bien !";
      if (distance < 1000) return "Pas mal.";
      if (distance < 2500) return "Assez loin.";
      return "Très loin.";
    }

    function finishGame() {
      clearMapResults();

      if (currentUser) {
        currentUser.games += 1;
        currentUser.totalScore += totalScore;
        currentUser.bestScore = Math.max(currentUser.bestScore, totalScore);
        saveProfile(currentUser);
      }

      capitalNameEl.textContent = "Partie terminée";
      countryHintEl.textContent = "";
      messageEl.className = "success";
      messageEl.innerHTML =
        "<strong>Score final : " +
        totalScore.toLocaleString("fr-FR") +
        " / 10 000.</strong>";

      nextButton.disabled = true;
    }

    map.on("click", event => {
      if (hasAnswered || !currentCapital || loginOverlay.classList.contains("open")) return;

      hasAnswered = true;

      const guess = event.latlng;
      const answer = L.latLng(currentCapital.lat, currentCapital.lng);
      const distance = distanceKm(guess.lat, guess.lng, answer.lat, answer.lng);
      const roundScore = calculateScore(distance);

      totalScore += roundScore;
      scoreEl.textContent = totalScore.toLocaleString("fr-FR");

      guessMarker = L.circleMarker(guess, {
        radius: 9,
        weight: 3,
        color: "#dc2626",
        fillColor: "#ef4444",
        fillOpacity: .9
      }).addTo(map).bindPopup("Votre réponse");

      answerMarker = L.circleMarker(answer, {
        radius: 9,
        weight: 3,
        color: "#15803d",
        fillColor: "#22c55e",
        fillOpacity: .9
      }).addTo(map).bindPopup(currentCapital.capital);

      answerLine = L.polyline([guess, answer], {
        weight: 3,
        color: "#334155",
        dashArray: "7,8"
      }).addTo(map);

      map.fitBounds(L.latLngBounds([guess, answer]), {
        paddingTopLeft: [35, 125],
        paddingBottomRight: [35, 155],
        maxZoom: 6
      });

      messageEl.className = distance < 400 ? "success" : "error";
      messageEl.innerHTML =
        "<strong>" + getQuality(distance) + "</strong> " +
        Math.round(distance).toLocaleString("fr-FR") +
        " km — " +
        roundScore.toLocaleString("fr-FR") +
        " points.";

      nextButton.disabled = false;

      if (navigator.vibrate) {
        navigator.vibrate(distance < 400 ? 40 : [30,30,30]);
      }
    });

    nextButton.addEventListener("click", () => {
      if (!hasAnswered) return;

      if (currentRound < 10) {
        currentRound++;
        map.setView([20, 8], 2);
        loadRound();
      } else {
        finishGame();
      }
    });

    restartButton.addEventListener("click", startGame);
    loginButton.addEventListener("click", login);

    usernameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });

    accountButton.addEventListener("click", showAccount);

    document.getElementById("closeAccountButton").addEventListener("click", () => {
      accountOverlay.classList.remove("open");
    });

    document.getElementById("changeAccountButton").addEventListener("click", logout);
    document.getElementById("deleteAccountButton").addEventListener("click", deleteCurrentAccount);

    window.addEventListener("resize", () => map.invalidateSize());
    window.addEventListener("orientationchange", () => {
      setTimeout(() => map.invalidateSize(), 250);
    });

    const savedUser = localStorage.getItem("geocapitales_current_user");

    if (savedUser) {
      currentUser = getProfile(savedUser);
      accountButton.textContent = "👤 " + currentUser.username;
      loginOverlay.classList.remove("open");
      startGame();
    }
  </script>
</body>
</html>
